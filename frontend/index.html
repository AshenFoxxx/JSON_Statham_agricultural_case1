<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрут грузовика</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e1a; color: #e2e8f0; }
        #map { width: 100%; height: 100vh; }
        .info-panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000; width: 340px;
            background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        h2 { font-size: 16px; margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin: 10px 0 4px; }
        input, button {
            width: 100%; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2);
            background: #0f172a; color: #e2e8f0; padding: 8px 10px;
        }
        button { margin-top: 12px; background: #0284c7; border: none; font-weight: 600; cursor: pointer; }
        .info-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(148, 163, 184, 0.1); }
        .info-label { color: #94a3b8; font-size: 13px; }
        .info-value { color: #38bdf8; font-weight: 600; }
        .error { color: #fca5a5; font-size: 13px; margin-top: 8px; }
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); color: #e2e8f0; border-radius: 12px; }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h2>Маршрут грузовика</h2>
        <label for="api">Адрес бэкенда</label>
        <input id="api" value="http://127.0.0.1:8000">
        <label for="points">Точки: id, долгота, широта. По одной на строку</label>
        <textarea id="points" rows="5" style="width:100%; border-radius:10px; padding:8px; background:#0f172a; color:#e2e8f0; border:1px solid rgba(148,163,184,0.2);">farm, 36.6103, 55.0969
kaluga, 36.2613, 54.5138
tula, 37.6173, 54.1930</textarea>
        <button id="build" type="button">Построить маршрут</button>
        <p id="error" class="error"></p>
        <div class="info-item"><span class="info-label">Расстояние</span><span class="info-value" id="distance">—</span></div>
        <div class="info-item"><span class="info-label">Время</span><span class="info-value" id="duration">—</span></div>
        <div class="info-item"><span class="info-label">Топливо</span><span class="info-value" id="fuel">—</span></div>
        <div class="info-item"><span class="info-label">Стоимость топлива</span><span class="info-value" id="cost">—</span></div>
    </div>
    <script>
        const map = L.map('map', { zoomControl: true }).setView([55.1, 36.6], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let drawn = [];

        function clearMap() {
            drawn.forEach(layer => map.removeLayer(layer));
            drawn = [];
        }

        function marker(lat, lng, color, title) {
            const icon = L.divIcon({
                className: '',
                html: '<div style="background:' + color + ';width:18px;height:18px;border-radius:50%;border:3px solid white;"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
            return L.marker([lat, lng], { icon }).addTo(map).bindPopup(title);
        }

        function parsePoints(text) {
            return text.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
                const [id, longitude, latitude] = line.split(',').map(part => part.trim());
                return { id, longitude: Number(longitude), latitude: Number(latitude) };
            });
        }

        document.getElementById('build').addEventListener('click', async () => {
            const error = document.getElementById('error');
            error.textContent = '';
            const api = document.getElementById('api').value.replace(/\/$/, '');
            try {
                const response = await fetch(api + '/api/v1/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ points: parsePoints(document.getElementById('points').value) })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Бэкенд не построил маршрут');
                }
                clearMap();
                drawn.push(L.geoJSON(data.geometry, {
                    style: { color: '#38bdf8', weight: 6, opacity: 0.9 }
                }).addTo(map));
                data.waypoints.forEach((point, index) => {
                    const color = index === 0 ? '#22c55e' : (index === data.waypoints.length - 1 ? '#ef4444' : '#fbbf24');
                    drawn.push(marker(point.latitude, point.longitude, color, point.id));
                });
                map.fitBounds(L.geoJSON(data.geometry).getBounds(), { padding: [80, 80] });
                document.getElementById('distance').textContent = data.distance_km + ' км';
                document.getElementById('duration').textContent = data.duration_hours.toFixed(1) + ' ч';
                document.getElementById('fuel').textContent = data.fuel_liters + ' л';
                document.getElementById('cost').textContent = Math.round(data.fuel_cost_rub) + ' руб';
            } catch (err) {
                error.textContent = err.message;
            }
        });
    </script>
</body>
</html>
