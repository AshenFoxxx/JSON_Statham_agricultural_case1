services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - agro-data:/data
    environment:
      DATABASE_URL: sqlite:////data/agro.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend
      - docs
    restart: unless-stopped

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./docs/content:/app/content
      - ./docs/static:/app/static
      - ./docs/templates:/app/templates
    restart: unless-stopped

volumes:
  agro-data:
